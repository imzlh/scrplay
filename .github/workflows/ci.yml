name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm ffmpeg libsdl2-2.0-0 \
             libsdl2-dev libavcodec-dev libavdevice-dev libavformat-dev \
             libavutil-dev libswresample-dev libusb-1.0-0 libusb-1.0-0-dev \
             libv4l-dev

      - name: Configure
        # The prebuilt server jar (server/scrplay-server) is tracked in the
        # repository, so building the client does not require the Android SDK.
        run: meson setup build -Dcompile_server=false

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build
